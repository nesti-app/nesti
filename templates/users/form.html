{% extends "base.html" %}
{% block title %}{{ 'Редагувати' if user else 'Новий' }} користувач — Nesti{% endblock %}
{% block content %}
<div class="py-8">
    <div class="mx-auto max-w-xl">
        <div class="mb-6">
            <a href="/admin/users" class="text-sm text-indigo-600 hover:text-indigo-500">&larr; Назад до списку</a>
        </div>
        <h1 class="mb-6 text-2xl font-bold text-gray-900">{{ 'Редагувати' if user else 'Новий' }} користувач</h1>
        {% if error %}
        <div class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-700">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ '/admin/users/' ~ user.id ~ '/edit' if user else '/admin/users/new' }}" class="space-y-4 rounded-lg border bg-white p-6 shadow-sm">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email *</label>
                <input type="email" name="email" id="email" value="{{ user.email if user else '' }}" required class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
                <label for="display_name" class="block text-sm font-medium text-gray-700">Ім'я</label>
                <input type="text" name="display_name" id="display_name" value="{{ user.display_name if user and user.display_name else '' }}" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Пароль {{ '*' if not user else '' }}</label>
                <input type="password" name="password" id="password" {{ '' if user else 'required' }} minlength="6" placeholder="{{ 'Залиште порожнім, щоб не змінювати' if user else '' }}" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
                <label for="role" class="block text-sm font-medium text-gray-700">Роль</label>
                <select name="role" id="role" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    {% for r in ['admin', 'editor', 'viewer'] %}
                    <option value="{{ r }}" {% if user and user.role == r %}selected{% endif %}>{{ r }}</option>
                    {% endfor %}
                </select>
            </div>
            {% if user %}
            <div class="flex items-center gap-2">
                <input type="checkbox" name="is_active" id="is_active" value="true" {% if user.is_active %}checked{% endif %} class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                <label for="is_active" class="text-sm font-medium text-gray-700">Активний</label>
            </div>
            {% endif %}
            <div class="flex gap-3 pt-2">
                <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500">Зберегти</button>
                <a href="/admin/users" class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Скасувати</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
