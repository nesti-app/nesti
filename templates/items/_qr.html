<div class="mt-4">
    <h2 class="text-sm font-medium text-gray-500">QR-код</h2>
    <div class="mt-2 flex items-start gap-4">
        <img src="/items/{{ item.id }}/qr" alt="QR-код" class="h-32 w-32 rounded-md border bg-white p-1" />
        <div class="flex flex-col gap-2">
            <a href="/items/{{ item.id }}/qr/download" class="inline-flex items-center rounded-md border border-gray-300 px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50">
                Завантажити QR
            </a>
            <span class="text-xs text-gray-400">{{ item.id }}</span>
        </div>
    </div>
</div>
