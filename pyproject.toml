[project]
name = "nesti"
version = "0.1.0"
description = "Nesti — Home Inventory Catalog"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = []

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.18",
    "httpx>=0.28,<1",
    "python-jose[cryptography]>=3.3,<4",
    "supabase>=2.12,<3",
    "Pillow>=11,<12",
    "pillow-heif>=1,<2",
    "qrcode[pil]>=8,<9",
    "python-dotenv>=1.0,<2",
    "aiofiles>=24,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "playwright>=1.49,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 96

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "B008",  # FastAPI Depends() in default args — standard pattern
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jinja2.*", "qrcode.*", "supabase.*", "aiofiles.*", "pillow_heif.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pytest-cov]
source = ["app"]
