services:
  app:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nesti
      POSTGRES_PASSWORD: nesti
      POSTGRES_DB: nesti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nesti"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
